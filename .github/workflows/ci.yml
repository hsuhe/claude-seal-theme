name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支有新的 push 時，取消還在跑的舊 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 一個版本失敗時另一個照樣跑完，才看得出是哪個版本壞掉。
      fail-fast: false
      matrix:
        # 2.1.323 是 README 寫的最低需求，改最低需求時兩邊一起改；
        # 2.1.331 是最近測過的版本，要換版時手動改這裡。
        claude-code: ['2.1.323', '2.1.331']
    env:
      CLAUDE_CODE_VERSION: ${{ matrix.claude-code }}
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: 安裝 Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: 檢查 manifest 與 hooks
        run: claude plugin validate .

      - name: 跑測試
        run: claude plugin test .
